name: "Manipuler des données (Data Manipulation)"
resources:
- name: "Autres programmes à découvrir (Further Programs to Learn)"
  type: markdown
  content: |
    Il existe _d'innombrables_ programmes que les spécialistes du shell utilisent pour manipuler des données.
    Chaque programme fait des choses précises, en suivant en général la [philosophie Unix](https://en.wikipedia.org/wiki/Unix_philosophy) : faire une seule chose, et la faire bien.
    On peut enchaîner ces programmes pour obtenir des logiques composées vraiment puissantes.
    Voici quelques exemples, à découvrir par soi-même une fois le Linux Luminarium terminé :

    - [awk](https://linux.die.net/man/1/awk) pour le traitement complexe de texte
    - [cut](https://linux.die.net/man/1/cut) pour extraire des parties de lignes
    - [less](https://linux.die.net/man/1/less) pour un lecteur de fichiers interactif
    - [more](https://linux.die.net/man/1/more) pour lire un fichier par parties
    - [paste](https://linux.die.net/man/1/paste) pour combiner des fichiers
    - [sed](https://linux.die.net/man/1/sed) pour la manipulation complexe de texte
    - [sort](https://linux.die.net/man/1/sort) pour trier des données
    - [tail](https://linux.die.net/man/1/tail) comme l'inverse de `head`
    - [uniq](https://linux.die.net/man/1/uniq) pour filtrer les données uniques d'un flux
